name: Build Lumen for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lumen/**'
      - 'ui/**'
      - 'sublime_shim/**'
      - 'lumen_win.py'
      - 'Lumen.spec'
      - 'build_windows.bat'
      - '.github/workflows/build-windows.yml'

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.10,<7" pywebview
      - name: Build full application directory
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm Lumen.spec
      - name: Check packaged runtime and resources
        shell: pwsh
        run: |
          $root = 'dist/Lumen'
          if (!(Test-Path "$root/Lumen.exe")) { throw 'Lumen.exe not found' }
          if (!(Test-Path "$root/_internal/python312.dll")) { throw 'Bundled Python runtime DLL is missing' }
          if (!(Test-Path "$root/_internal/ui")) { throw 'UI assets missing' }
          if (!(Test-Path "$root/_internal/sublime_shim")) { throw 'Plugin shim missing' }
          Write-Host 'Validated executable, Python DLL and application assets.'
      - name: Create distributable ZIP containing all files
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/Lumen' -DestinationPath 'Lumen-Windows-x64.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-Windows-x64
          path: Lumen-Windows-x64.zip
          if-no-files-found: error
