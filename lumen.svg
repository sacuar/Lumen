<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#0b1e35"/>
      <stop offset="0.55" stop-color="#0d2a4a"/>
      <stop offset="1"   stop-color="#0a1626"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd3ff"/>
      <stop offset="1" stop-color="#007acc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#d9f2ff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#4fc1ff" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#4fc1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded square background -->
  <rect x="8" y="8" width="240" height="240" rx="52" ry="52"
        fill="url(#bg)" stroke="#0a1421" stroke-width="4"/>

  <!-- faint grid texture -->
  <g opacity="0.08" stroke="#7fd3ff" stroke-width="1">
    <path d="M32 64H224M32 96H224M32 128H224M32 160H224M32 192H224"/>
    <path d="M64 32V224M96 32V224M128 32V224M160 32V224M192 32V224"/>
  </g>

  <!-- stylized "L" built from a code caret -->
  <g fill="none" stroke="url(#stroke)" stroke-width="20"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- vertical stroke -->
    <path d="M92 76 V180"/>
    <!-- horizontal stroke -->
    <path d="M92 180 H164"/>
    <!-- accent bracket -->
    <path d="M186 84 L164 108 L186 132" stroke-width="14" opacity="0.85"/>
  </g>

  <!-- glow dot (the lumen) -->
  <circle cx="184" cy="76" r="44" fill="url(#glow)"/>
  <circle cx="184" cy="76" r="13" fill="#e6f7ff"/>
  <circle cx="184" cy="76" r="6"  fill="#ffffff"/>

  <!-- baseline accent line -->
  <rect x="60" y="204" width="136" height="6" rx="3"
        fill="url(#stroke)" opacity="0.7"/>
</svg>